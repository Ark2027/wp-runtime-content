name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor the plugin header declares, so it gets checked too.
        php-version: ["7.4", "8.2"]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Syntax check
        run: php -l wp-runtime-content.php

      # Catching these in review is unreliable; catching them here is not.
      - name: Output escaping and capability checks are present
        run: |
          set -e
          require() {
            if ! grep -q "$1" wp-runtime-content.php; then
              echo "::error::missing expected safeguard: $2"
              exit 1
            fi
            echo "  ok: $2"
          }
          require "wp_verify_nonce"                "nonce verification on save"
          require "current_user_can"               "capability check"
          require "wp_kses_post"                   "body copy sanitisation"
          require "esc_textarea"                   "textarea escaping"
          require "esc_url"                        "url escaping"
          require "wprc_is_hex_color"              "colour validation before it reaches a style attribute"
          require "defined( 'ABSPATH' )"           "direct access guard"

      - name: No raw echo of request data
        run: |
          if grep -nE 'echo\s+\$_(POST|GET|REQUEST|SERVER)' wp-runtime-content.php; then
            echo "::error::request data echoed without escaping"
            exit 1
          fi
          echo "  ok: no unescaped request data reaches output"
